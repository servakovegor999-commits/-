<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#1c7a5c">
<title>Круг</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0;font-size:14px}</style>
</head>
<body>
<div id="authView" class="auth" hidden>
  <div class="card">
    <svg class="mark" viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="AG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent-2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs><circle cx="48" cy="48" r="44" fill="none" stroke="var(--accent-soft)" stroke-width="3"/><circle cx="48" cy="48" r="32" fill="none" stroke="url(#AG)" stroke-width="7"/><circle cx="48" cy="48" r="15" fill="url(#AG)"/><circle cx="48" cy="16" r="6" fill="var(--dot)"/></svg>
    <h1>Круг</h1>
    <p class="sub">Закрытая сеть для своих</p>
    <div class="seg" role="group" aria-label="Вход или регистрация">
      <button type="button" id="tabLogin" aria-pressed="true">Вход</button>
      <button type="button" id="tabReg" aria-pressed="false">Регистрация</button>
    </div>
    <form id="authForm" autocomplete="on">
      <div class="field" id="fInvite" hidden><label for="aInvite">Код приглашения</label><input id="aInvite" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="field" id="fName" hidden><label for="aName">Ваше имя</label><input id="aName" maxlength="40" autocomplete="name"></div>
      <div class="field"><label for="aUser">Логин</label><input id="aUser" maxlength="24" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
      <div class="field"><label for="aPass">Пароль</label><input id="aPass" type="password" autocomplete="current-password" required></div>
      <div class="err" id="aErr" role="alert"></div>
      <button class="btn" id="aBtn">Войти</button>
    </form>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side-head">
      <div class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="LG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent-2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs><circle cx="24" cy="24" r="21" fill="none" stroke="url(#LG)" stroke-width="5"/><circle cx="24" cy="24" r="10" fill="url(#LG)"/><circle cx="24" cy="3.5" r="3.5" fill="var(--dot)"/></svg>Круг</div>
      <div class="sp"></div>
      <button class="iconbtn" id="newBtn" title="Создать группу или канал" aria-label="Создать группу или канал"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input class="search" id="search" type="search" placeholder="Поиск" aria-label="Поиск по чатам и людям"></div>
    <div class="tabs" role="group" aria-label="Разделы">
      <button data-tab="chats" aria-pressed="true">Чаты</button>
      <button data-tab="people" aria-pressed="false">Люди</button>
      <button data-tab="explore" aria-pressed="false">Обзор</button>
    </div>
    <div class="list" id="list"></div>
    <div class="me-bar" id="meBar"></div>
  </aside>
  <main class="main" id="main">
    <div class="welcome" id="welcome">
      <div class="card">
        <svg class="mark" viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="WG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent-2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs><circle cx="48" cy="48" r="44" fill="none" stroke="var(--accent-soft)" stroke-width="3"/><circle cx="48" cy="48" r="32" fill="none" stroke="url(#WG)" stroke-width="7"/><circle cx="48" cy="48" r="15" fill="url(#WG)"/><circle cx="48" cy="16" r="6" fill="var(--dot)"/><circle cx="18" cy="70" r="5" fill="var(--accent-2)"/><circle cx="82" cy="66" r="4" fill="var(--accent)"/></svg>
        <h1>Свой круг общения</h1>
        <div class="feats"><span>Личные чаты</span><span>Группы</span><span>Каналы</span></div>
        <p>Выберите чат слева или начните новый разговор.</p>
        <div class="acts">
          <button class="btn" data-open="people">Написать человеку</button>
          <button class="btn ghost" data-open="new">Создать группу или канал</button>
        </div>
      </div>
    </div>
    <div id="chatView" hidden style="display:contents"></div>
  </main>
</div>
<div class="conn" id="conn" hidden>Нет связи с сервером, переподключаюсь…</div>
<script src="/app.js"></script>
</body>
</html>
